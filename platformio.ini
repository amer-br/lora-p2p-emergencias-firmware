; Firmware del LilyGO T-Beam v1.2 (AXP2101) para la red LoRa de emergencias.
;
;   pio run -e pasarela -t upload     T-Beam conectado por USB al panel
;   pio run -e modem -t upload        T-Beam de bolsillo conectado por BLE al teléfono
;   pio device monitor                ver la salida serie (115200)
;
; Los dos modos comparten src/main.cpp (radio, malla y pantalla); solo cambia
; el enlace: enlace_serie.cpp (pasarela) o enlace_ble.cpp (módem).

[env]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.1.2
    lewisxhe/XPowersLib@0.2.6
    olikraus/U8g2@^2.35.19

[env:pasarela]
build_flags = -DMODO_PASARELA
build_src_filter = +<*> -<enlace_ble.cpp>

[env:modem]
build_flags = -DMODO_MODEM
build_src_filter = +<*> -<enlace_serie.cpp>
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3
