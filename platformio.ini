; Firmware del LilyGO T-Beam v1.2 (AXP2101) para la red LoRa de emergencias.
;
;   pio run -e pasarela                 compilar
;   pio run -e pasarela -t upload       grabar en la placa conectada por USB
;   pio device monitor                  ver la salida serie (115200)
;
; Por ahora solo existe el modo pasarela (T-Beam conectado por USB al panel).
; El modo módem (enlace BLE con el teléfono) queda pendiente.

[env]
platform = espressif32@6.9.0
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    jgromes/RadioLib@7.1.2
    lewisxhe/XPowersLib@0.2.6

[env:pasarela]
build_flags = -DMODO_PASARELA
